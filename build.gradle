plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Fabric's maven is added by Loom. Add more here only if a dependency needs it.
}

loom {
    // Only a client environment exists for this mod: no dedicated-server run config.
    runConfigs.matching { it.name == 'server' }.configureEach { ideConfigGenerated = false }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Official Mojang names: the same names Minecraft 26.x ships with, which keeps a later port small.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Gson is bundled with Minecraft itself, so no extra dependency is needed for configuration.
}

processResources {
    def props = [version: project.version, minecraft_version: project.minecraft_version, loader_version: project.loader_version]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property 'archivesName', project.base.archivesName
    from('LICENSE') {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}
